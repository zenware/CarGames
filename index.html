<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Song Game · CarGames</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Persistent slim top bar -->
    <header class="topbar">
      <div id="scoreStrip" class="score-strip"></div>
      <div class="topbar-right">
        <span id="offlinePill" class="offline-pill hidden" aria-live="polite">Offline</span>
        <button id="btnMenu" class="menu-btn icon-only" type="button" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="18" x2="20" y2="18" />
          </svg>
          <span id="queuePill" class="queue-pill hidden">0</span>
        </button>
      </div>
    </header>

    <!-- State machine screen mount -->
    <main id="screen" class="screen" aria-live="polite"></main>
  </div>

  <!-- Full-screen Menu Overlay -->
  <div id="menuOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Game menu">
    <div class="overlay-inner" id="menuContent"></div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="fxFlash" class="fx-flash" aria-hidden="true"></div>
  <canvas id="fxCanvas" class="fx-canvas" aria-hidden="true"></canvas>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
